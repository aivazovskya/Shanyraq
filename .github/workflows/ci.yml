name: Shanyraq CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: shanyraq_admin
      POSTGRES_PASSWORD: shanyraq_secure_password_2026
      POSTGRES_DB: shanyraq_test
      POSTGRES_SHADOW_DB: shanyraq_shadow

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shanyraq_admin
          POSTGRES_PASSWORD: shanyraq_secure_password_2026
          POSTGRES_DB: shanyraq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Deploy Prisma Migrations (clean database)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}?schema=public
        run: npx prisma migrate deploy

      - name: Create Shadow Database for CI Drift Check
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -c "CREATE DATABASE ${{ env.POSTGRES_SHADOW_DB }};"

      - name: Verify Schema Drift (migrations vs schema.prisma)
        working-directory: backend
        env:
          SHADOW_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_SHADOW_DB }}?schema=public
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Run Unit Tests (Votings, Quorum, RBAC)
        working-directory: backend
        run: npm test

      - name: Build Backend
        working-directory: backend
        run: npm run build

  frontend-build:
    name: Frontend Web Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-web/package.json

      - name: Install dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build Next.js Web Admin
        working-directory: frontend-web
        run: npm run build

  docker-build:
    name: Docker Images Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: shanyraq-backend:latest

      - name: Build Frontend Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          file: ./frontend-web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
          tags: shanyraq-web:latest

