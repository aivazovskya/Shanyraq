version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shanyraq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shanyraq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shanyraq_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-shanyraq_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shanyraq_admin} -d ${POSTGRES_DB:-shanyraq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shanyraq-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: chrislusf/seaweedfs:4.50
    container_name: shanyraq-s3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-s3.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-shanyraq_minio}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-shanyraq_minio_secret_key}}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shanyraq_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shanyraq_minio_secret_key}
    ports:
      - "9000:9000"
      - "${S3_CONSOLE_PORT:-${MINIO_CONSOLE_PORT:-9001}}:8888"
    volumes:
      - ./infra/s3/entrypoint.sh:/entrypoint-s3.sh:ro
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status > /dev/null && nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: shanyraq-go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984" # Web UI / API
      - "8554:8554" # RTSP
      - "8555:8555" # WebRTC
    volumes:
      - ./infra/go2rtc.yaml:/config/go2rtc.yaml:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
