name: shanyraq-dispatcher-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatcher_e2e
      POSTGRES_PASSWORD: local-disposable-e2e-only
      POSTGRES_DB: shanyraq_dispatcher_e2e
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher_e2e -d shanyraq_dispatcher_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: server /data
    environment:
      MINIO_ROOT_USER: dispatcher_e2e
      MINIO_ROOT_PASSWORD: local-disposable-e2e-only
    ports: ["127.0.0.1:59000:9000"]
