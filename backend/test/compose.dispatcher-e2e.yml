name: shanyraq-dispatcher-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatcher_e2e
      POSTGRES_PASSWORD: local-disposable-e2e-only
      POSTGRES_DB: shanyraq_dispatcher_e2e
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher_e2e -d shanyraq_dispatcher_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.50
    container_name: shanyraq-dispatcher-e2e-s3
    entrypoint: ["/bin/sh", "/entrypoint-s3.sh"]
    environment:
      S3_ACCESS_KEY: dispatcher_e2e
      S3_SECRET_KEY: local-disposable-e2e-only
      MINIO_ROOT_USER: dispatcher_e2e
      MINIO_ROOT_PASSWORD: local-disposable-e2e-only
    ports: ["127.0.0.1:59000:9000"]
    volumes:
      - ../../infra/s3/entrypoint.sh:/entrypoint-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status > /dev/null && nc -z 127.0.0.1 9000 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
